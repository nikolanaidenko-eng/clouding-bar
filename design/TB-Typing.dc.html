<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Touch Bar typing</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes caret{0%,100%{opacity:1}50%{opacity:0}}
</style>
</helmet>
<div style="width: 2170px; height: 60px; box-sizing: border-box; background: #000000; display: flex; align-items: center; gap: 12px; padding: 0 8px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #F5F5F7">
  <div aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: #1C1C1E; color: #8E8E93; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></div>
  <button aria-label="Open Clouding Bar" style="width: 120px; height: 60px; flex-shrink: 0; border-radius: 12px; border: none; background: #2C2C2E; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><dc-import name="Mascot" state="wait" size="56" hint-size="56px,56px"></dc-import></button>
  <div aria-label="Session 42%, context 31%" style="width: 120px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 0 4px">
    <div style="height: 6px; border-radius: 3px; background: #2C2C2E; overflow: hidden"><div style="width: 42%; height: 6px; background: #E5E5EA"></div></div>
    <div style="height: 6px; border-radius: 3px; background: #2C2C2E; overflow: hidden"><div style="width: 31%; height: 6px; background: #8E8E93"></div></div>
  </div>
  <label for="answer" style="flex-shrink: 0; font-size: 22px; color: #A1A1A6; padding-left: 8px">Other</label>
  <input id="answer" type="text" value="{{text}}" onChange="{{onChange}}" placeholder="Type your answer" style="flex: 1 1 0; min-width: 0; height: 60px; box-sizing: border-box; border-radius: 12px; border: 2px solid #48484A; background: #1C1C1E; color: #F5F5F7; padding: 0 20px; font-family: inherit; font-size: {{fontSize}}; outline: none; transition: font-size 160ms; animation: slideIn 240ms cubic-bezier(.2,.8,.2,1) both">
  <button style="width: 170px; height: 60px; flex-shrink: 0; border-radius: 12px; border: none; background: #0071E3; color: #FFFFFF; font-family: inherit; font-size: 26px; font-weight: 600">Send</button>
  <button aria-label="Dictate" style="width: 96px; height: 60px; flex-shrink: 0; border-radius: 12px; border: none; background: #2C2C2E; color: #F5F5F7; display: flex; align-items: center; justify-content: center">
    <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2170,"height":60}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { text: 'WatermelonDB for now, add sync to the backend in the next sprint' }; }
  renderVals() {
    const t = this.state.text;
    const n = t.length;
    const fontSize = n <= 40 ? '26px' : n <= 70 ? '22px' : '19px';
    return {
      text: t, fontSize, count: String(n),
      onChange: (e) => this.setState({ text: e.target.value })
    };
  }
}
</script>
</body>
</html>
