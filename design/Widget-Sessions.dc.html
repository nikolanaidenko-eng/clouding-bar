<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget sessions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#1B1B1D}
@keyframes sheetIn{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="width: 400px; height: 480px; box-sizing: border-box; background: #1B1B1D; padding: 20px; display: flex; flex-direction: column; align-items: flex-end; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #F5F5F7">
  <section aria-label="Sessions" style="width: 320px; box-sizing: border-box; border-radius: 18px; border: 0.5px solid rgba(255,255,255,0.14); background: rgba(40,40,42,0.78); backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%); box-shadow: 0 16px 40px rgba(0,0,0,0.4); padding: 8px 14px 14px; display: flex; flex-direction: column; gap: 8px; animation: sheetIn 260ms cubic-bezier(.2,.8,.2,1) both">
    <div style="display: flex; align-items: center; gap: 4px">
      <button aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: transparent; color: #A1A1A6; display: flex; align-items: center; justify-content: center; cursor: pointer; margin-left: -12px">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>
      <span style="font-size: 13px; font-weight: 600; flex-grow: 1">Sessions</span>
      <span style="font-size: 12px; color: #A1A1A6">Session 42%</span>
    </div>
    <div style="display: flex; flex-direction: column; border-radius: 12px; background: rgba(255,255,255,0.06); overflow: hidden">
      <sc-for list="{{sessions}}" as="s" hint-placeholder-count="5">
        <button style="height: 52px; border: none; border-bottom: 0.5px solid rgba(255,255,255,0.08); background: {{s.bg}}; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 8px; color: #F5F5F7; font-family: inherit; text-align: left; cursor: pointer">
          <dc-import name="Mascot" state="{{s.state}}" size="28" hint-size="28px,28px"></dc-import>
          <span style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0">
            <span style="font-size: 13px">{{s.name}}</span>
            <span style="font-size: 11px; color: {{s.statusColor}}">{{s.status}}</span>
          </span>
          <span style="font-size: 12px; font-variant-numeric: tabular-nums; color: {{s.ctxColor}}">{{s.ctx}}</span>
        </button>
      </sc-for>
    </div>
    <span style="font-size: 11px; color: #A1A1A6; padding: 0 2px">Click to open its VS Code window · % = context</span>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (name, status, state, ctx, level, waiting) => ({
      name, status, state, ctx,
      bg: waiting ? 'rgba(255,159,10,0.10)' : 'transparent',
      statusColor: waiting ? '#FFB340' : '#A1A1A6',
      ctxColor: level === 2 ? '#FF6961' : level === 1 ? '#FFB340' : '#A1A1A6'
    });
    return { sessions: [
      row('DiaRoute', 'Needs your OK', 'wait', '31%', 0, true),
      row('bots', 'Working · 2 min', 'work', '58%', 0, false),
      row('agent-office', 'Working · 9 min', 'work', '83%', 1, false),
      row('claudebar', 'Idle · 12 min', 'sleep', '94%', 2, false),
      row('landing', 'Idle · 1 h', 'sleep', '12%', 0, false)
    ] };
  }
}
</script>
</body>
</html>
