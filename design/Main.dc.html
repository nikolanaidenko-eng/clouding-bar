<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget prototype</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#1B1B1D}
a{color:#64A8FF}a:hover{color:#8CBEFF}
@keyframes sheetIn{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes fillIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
</helmet>
<div style="width: 400px; height: 480px; box-sizing: border-box; background: #1B1B1D; padding: 20px; display: flex; flex-direction: column; align-items: flex-end; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #F5F5F7">
  <sc-if value="{{collapsed}}" hint-placeholder-val="{{ false }}">
    <button onMouseEnter="{{open}}" onClick="{{open}}" aria-label="Show Clouding Bar" style="height: 44px; box-sizing: border-box; border-radius: 22px; border: 0.5px solid rgba(255,255,255,0.14); background: rgba(40,40,42,0.78); backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%); box-shadow: 0 8px 24px rgba(0,0,0,0.35); display: flex; align-items: center; gap: 10px; padding: 0 16px 0 8px; cursor: pointer; color: #F5F5F7; font-family: inherit; animation: popIn 220ms cubic-bezier(.2,.8,.2,1) both">
      <dc-import name="Mascot" state="work" size="30" hint-size="30px,30px"></dc-import>
      <span style="display: flex; align-items: center; gap: 12px; font-size: 13px; font-variant-numeric: tabular-nums">
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 28px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.14); overflow: hidden; display: block"><span style="width: 42%; height: 3px; background: #E5E5EA; display: block"></span></span>42%</span>
        <span style="display: flex; align-items: center; gap: 4px"><span style="color: #A1A1A6; font-size: 11px">ctx</span>31%</span>
        <span style="display: flex; align-items: center; gap: 4px"><svg aria-label="resets in" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A1A1A6" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>1:23</span>
      </span>
    </button>
  </sc-if>
  <sc-if value="{{expanded}}" hint-placeholder-val="{{ true }}">
    <section onMouseLeave="{{close}}" aria-label="Clouding Bar" style="width: 320px; box-sizing: border-box; border-radius: 18px; border: 0.5px solid rgba(255,255,255,0.14); background: rgba(40,40,42,0.78); backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%); box-shadow: 0 16px 40px rgba(0,0,0,0.4); padding: 14px; display: flex; flex-direction: column; gap: 16px; transform-origin: top right; animation: sheetIn 280ms cubic-bezier(.2,.8,.2,1) both">
      <div style="display: flex; align-items: center; gap: 10px">
        <dc-import name="Mascot" state="work" size="32" hint-size="32px,32px"></dc-import>
        <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1">
          <span style="font-size: 13px; font-weight: 600">Working</span>
          <span style="font-size: 12px; color: #A1A1A6">DiaRoute</span>
        </div>
        <button onClick="{{close}}" aria-label="Collapse" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: transparent; color: #A1A1A6; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"></path></svg>
        </button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 12px"><span style="color: #A1A1A6">Session</span><span style="font-weight: 600; font-variant-numeric: tabular-nums">42%</span></div>
        <div style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12); overflow: hidden"><div style="width: 42%; height: 4px; border-radius: 2px; background: #E5E5EA; transform-origin: left; animation: fillIn 900ms cubic-bezier(.2,.8,.2,1) both"></div></div>
        <span style="font-size: 11px; color: #A1A1A6">Resets in 1 h 23 min</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 12px"><span style="color: #A1A1A6">Context</span><span style="font-weight: 600; font-variant-numeric: tabular-nums">31%</span></div>
        <div style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12); overflow: hidden"><div style="width: 31%; height: 4px; border-radius: 2px; background: #E5E5EA; transform-origin: left; animation: fillIn 900ms 120ms cubic-bezier(.2,.8,.2,1) both"></div></div>
        <span style="font-size: 11px; color: #A1A1A6; font-variant-numeric: tabular-nums">41.2k in · 2.3k out</span>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
        <button style="height: 44px; border-radius: 12px; border: none; background: rgba(255,255,255,0.08); color: #F5F5F7; font-family: inherit; font-size: 13px; cursor: pointer">caveman</button>
        <button style="height: 44px; border-radius: 12px; border: none; background: rgba(255,255,255,0.08); color: #F5F5F7; font-family: inherit; font-size: 13px; cursor: pointer">compact</button>
        <button style="height: 44px; border-radius: 12px; border: none; background: rgba(255,255,255,0.08); color: #F5F5F7; font-family: inherit; font-size: 13px; cursor: pointer">office</button>
      </div>

      <div style="display: flex; align-items: center; gap: 6px; border-top: 0.5px solid rgba(255,255,255,0.1); padding-top: 10px">
        <button style="height: 44px; flex-grow: 1; border-radius: 12px; border: none; background: transparent; color: #A1A1A6; font-family: inherit; font-size: 12px; display: flex; align-items: center; gap: 6px; padding: 0 6px; cursor: pointer">3 sessions<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"></path></svg></button>
        <button aria-label="Hold to talk" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: rgba(255,255,255,0.1); color: #F5F5F7; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
        </button>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":480}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: true }; }
  renderVals() {
    const open = this.state.open;
    return {
      expanded: open, collapsed: !open,
      open: () => this.setState({ open: true }),
      close: () => this.setState({ open: false })
    };
  }
}
</script>
</body>
</html>
