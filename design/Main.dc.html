<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget prototype</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#1B1B1D}
@keyframes sheetIn{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes fillIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
</helmet>
<div style="width: 640px; height: 300px; box-sizing: border-box; background: #1B1B1D; padding: 20px 30px; display: flex; flex-direction: column; align-items: center; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #F5F5F7">
  <sc-if value="{{collapsed}}" hint-placeholder-val="{{ false }}">
    <button onClick="{{open}}" aria-label="Show Clouding Bar" style="height: 44px; box-sizing: border-box; border-radius: 22px; border: 0.5px solid rgba(255,255,255,0.14); background: rgba(40,40,42,0.78); backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%); box-shadow: 0 8px 24px rgba(0,0,0,0.35); display: flex; align-items: center; gap: 16px; padding: 0 20px 0 10px; cursor: pointer; color: #F5F5F7; font-family: inherit; font-size: 13px; font-variant-numeric: tabular-nums; animation: popIn 220ms cubic-bezier(.2,.8,.2,1) both">
      <dc-import name="Mascot" state="work" size="30" hint-size="30px,30px"></dc-import>
      <span style="display: flex; align-items: center; gap: 8px"><span style="width: 44px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.14); overflow: hidden; display: block"><span style="width: 42%; height: 3px; background: #E5E5EA; display: block"></span></span>42%</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="color: #A1A1A6; font-size: 11px">ctx</span><span style="width: 44px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.14); overflow: hidden; display: block"><span style="width: 31%; height: 3px; background: #E5E5EA; display: block"></span></span>31%</span>
      <span style="display: flex; align-items: center; gap: 4px"><svg aria-label="resets in" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A1A1A6" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>1:23</span>
    </button>
  </sc-if>
  <sc-if value="{{expanded}}" hint-placeholder-val="{{ true }}">
    <section onMouseLeave="{{close}}" aria-label="Clouding Bar" style="width: {{panelWidth}}; box-sizing: border-box; border-radius: 18px; border: 0.5px solid rgba(255,255,255,0.14); background: rgba(40,40,42,0.78); backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%); box-shadow: 0 16px 40px rgba(0,0,0,0.4); padding: 8px 8px 12px 12px; display: flex; flex-direction: column; gap: 10px; transform-origin: top center; animation: sheetIn 280ms cubic-bezier(.2,.8,.2,1) both">
      <div style="display: flex; align-items: center; gap: 8px">
        <dc-import name="Mascot" state="work" size="24" hint-size="24px,24px"></dc-import>
        <span style="font-size: 13px; font-weight: 600">Working</span>
        <span style="font-size: 12px; color: #A1A1A6; flex-grow: 1">DiaRoute</span>
        <button style="height: 28px; border: none; background: transparent; color: #A1A1A6; font-family: inherit; font-size: 12px; display: flex; align-items: center; gap: 4px; padding: 0; cursor: pointer">3 sessions<svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 6l6 6-6 6"></path></svg></button>
        <button onClick="{{close}}" aria-label="Collapse" style="width: 30px; height: 30px; border-radius: 15px; border: none; background: transparent; color: #A1A1A6; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"></path></svg>
        </button>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding-right: 4px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; font-size: 12px"><span style="color: #A1A1A6">Session</span><span style="font-weight: 600; font-variant-numeric: tabular-nums">42%</span></div>
          <div style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12); overflow: hidden"><div style="width: 42%; height: 4px; border-radius: 2px; background: #E5E5EA; transform-origin: left; animation: fillIn 900ms cubic-bezier(.2,.8,.2,1) both"></div></div>
          <span style="font-size: 11px; color: #A1A1A6">Resets in 1 h 23 min</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; font-size: 12px"><span style="color: #A1A1A6">Context</span><span style="font-weight: 600; font-variant-numeric: tabular-nums">31%</span></div>
          <div style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.12); overflow: hidden"><div style="width: 31%; height: 4px; border-radius: 2px; background: #E5E5EA; transform-origin: left; animation: fillIn 900ms 120ms cubic-bezier(.2,.8,.2,1) both"></div></div>
          <span style="font-size: 11px; color: #A1A1A6; font-variant-numeric: tabular-nums">41.2k in · 2.3k out</span>
        </div>
      </div>
      <sc-if value="{{showAll}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-wrap: wrap; gap: 8px; font-size: 11px; color: #A1A1A6; font-variant-numeric: tabular-nums">
          <span style="display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px; background: rgba(255,255,255,0.06)"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="6" width="12" height="12" rx="2"></rect><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"></path></svg>Opus 5.5 1M · xhigh</span>
          <span style="display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px; background: rgba(255,255,255,0.06)">+214 −37</span>
          <span style="display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px; background: rgba(255,255,255,0.06)"><svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="6" cy="5" r="2"></circle><circle cx="6" cy="19" r="2"></circle><circle cx="18" cy="7" r="2"></circle><path d="M6 7v10M18 9c0 5-12 3-12 8"></path></svg>clouding-bar</span>
          <span style="display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px; background: rgba(255,255,255,0.06)">2 subagents</span>
        </div>
      </sc-if>
      <div style="display: flex; gap: 6px; padding-right: 4px">
        <button style="flex: 1 1 0; min-width: 0; height: 32px; border-radius: 9px; border: none; background: rgba(255,255,255,0.08); color: #F5F5F7; font-family: inherit; font-size: 13px; cursor: pointer">caveman</button>
        <button style="flex: 1 1 0; min-width: 0; height: 32px; border-radius: 9px; border: none; background: rgba(255,255,255,0.08); color: #F5F5F7; font-family: inherit; font-size: 13px; cursor: pointer">compact</button>
        <button style="flex: 1 1 0; min-width: 0; height: 32px; border-radius: 9px; border: none; background: rgba(255,255,255,0.08); color: #F5F5F7; font-family: inherit; font-size: 13px; cursor: pointer">office</button>
        <sc-if value="{{showAll}}" hint-placeholder-val="{{ true }}">
          <button style="flex: 1 1 0; min-width: 0; height: 32px; border-radius: 9px; border: none; background: rgba(255,255,255,0.08); color: #F5F5F7; font-family: inherit; font-size: 13px; cursor: pointer">review</button>
          <button style="flex: 1 1 0; min-width: 0; height: 32px; border-radius: 9px; border: none; background: rgba(255,255,255,0.08); color: #F5F5F7; font-family: inherit; font-size: 13px; cursor: pointer">run tests</button>
          <button aria-label="Templates" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; border: none; background: rgba(255,255,255,0.1); color: #F5F5F7; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path></svg></button>
          <button aria-label="Screenshot" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; border: none; background: rgba(255,255,255,0.1); color: #F5F5F7; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
        </sc-if>
        <button aria-label="Dictate" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 16px; border: none; background: rgba(255,255,255,0.1); color: #F5F5F7; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
        </button>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showAll":{"editor":"boolean","default":false},"$preview":{"width":640,"height":300}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: true }; }
  renderVals() {
    const open = this.state.open;
    return {
      expanded: open, collapsed: !open,
      showAll: this.props.showAll ?? false,
      panelWidth: (this.props.showAll ?? false) ? '560px' : '420px',
      open: () => this.setState({ open: true }),
      close: () => this.setState({ open: false })
    };
  }
}
</script>
</body>
</html>
