<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Touch Bar normal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
@keyframes fillIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="width: 2170px; height: 60px; box-sizing: border-box; background: #000000; display: flex; align-items: center; gap: 12px; padding: 0 8px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #F5F5F7">
  <div aria-hidden="true" style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 20px; background: #1C1C1E; color: #8E8E93; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></div>
  <button aria-label="Open Clouding Bar" style="width: 120px; height: 60px; flex-shrink: 0; border-radius: 12px; border: none; background: #2C2C2E; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><dc-import name="Mascot" state="work" size="56" hint-size="56px,56px"></dc-import></button>
  <div style="flex: 1 1 0; min-width: 0; display: flex; gap: 28px; padding: 0 12px; transition: all 300ms">
    <div style="flex: 3 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 10px">
      <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 22px; line-height: 1; white-space: nowrap"><span style="color: #A1A1A6; overflow: hidden; text-overflow: ellipsis">{{sLabel}}</span><span style="font-variant-numeric: tabular-nums">42%<sc-if value="{{showTimer}}" hint-placeholder-val="{{ true }}"><span style="color: #A1A1A6"> · 1:23</span></sc-if></span></div>
      <div style="height: 8px; border-radius: 4px; background: #2C2C2E; overflow: hidden"><div style="width: 42%; height: 8px; border-radius: 4px; background: #E5E5EA; transform-origin: left; animation: fillIn 900ms cubic-bezier(.2,.8,.2,1) both"></div></div>
    </div>
    <div style="flex: 2 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 10px">
      <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 22px; line-height: 1; white-space: nowrap"><span style="color: #A1A1A6; overflow: hidden; text-overflow: ellipsis">{{cLabel}}</span><span style="font-variant-numeric: tabular-nums">31%</span></div>
      <div style="height: 8px; border-radius: 4px; background: #2C2C2E; overflow: hidden"><div style="width: 31%; height: 8px; border-radius: 4px; background: #E5E5EA; transform-origin: left; animation: fillIn 900ms 120ms cubic-bezier(.2,.8,.2,1) both"></div></div>
    </div>
  </div>
  <sc-for list="{{buttons}}" as="b" hint-placeholder-count="3">
    <button aria-label="{{b.label}}" style="width: {{b.w}}; height: 60px; flex-shrink: 0; border-radius: 12px; border: none; background: #2C2C2E; color: #F5F5F7; font-family: inherit; font-size: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 16px; animation: popIn 220ms cubic-bezier(.2,.8,.2,1) both">{{b.label}}</button>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"buttonCount":{"editor":"range","min":0,"max":7,"step":1,"default":3},"$preview":{"width":2170,"height":60}}'>
class Component extends DCLogic {
  renderVals() {
    const pool = [['caveman',170],['compact',170],['office',140],['review',150],['run tests',190],['/clear',140],['commit',160]];
    const n = Math.max(0, Math.min(7, Number(this.props.buttonCount ?? 3)));
    const picked = pool.slice(0, n);
    const used = picked.reduce((a, b) => a + b[1], 0);
    const avail = 2170 - 16 - 40 - 120 - 12 * (2 + n) - used; // the character is the first button now
    const wide = avail >= 900, mid = avail >= 560;
    return {
      buttons: picked.map(([label, w]) => ({ label, w: w + 'px' })),
      sLabel: wide ? 'Session' : mid ? '5h' : '',
      cLabel: wide ? 'Context' : mid ? 'Ctx' : '',
      showTimer: mid
    };
  }
}
</script>
</body>
</html>
