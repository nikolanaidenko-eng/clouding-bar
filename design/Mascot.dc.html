<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mascot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{px}}; height: {{px}}; display: flex; align-items: center; justify-content: center">
  <sc-if value="{{isSleep}}" hint-placeholder-val="{{ false }}">
    <svg role="img" aria-label="Sleeping" width="{{size}}" height="{{size}}" viewBox="0 0 40 40">
      <ellipse cx="20" cy="35.5" rx="9" ry="1.6" fill="#000000" opacity="0.35"></ellipse>
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1;1.02 0.97;1 1" dur="3.6s" repeatCount="indefinite" additive="sum"></animateTransform>
        <rect x="7" y="11" width="26" height="23" rx="11.5" fill="#B8B6B1"></rect>
        <path d="M13.6 22.2 q2.4 1.8 4.8 0" fill="none" stroke="#2C2C2E" stroke-width="1.6" stroke-linecap="round"></path>
        <path d="M21.6 22.2 q2.4 1.8 4.8 0" fill="none" stroke="#2C2C2E" stroke-width="1.6" stroke-linecap="round"></path>
      </g>
      <text x="29" y="9" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="6" font-weight="600" fill="#8E8E93">z<animate attributeName="opacity" values="0;1;0" dur="3.6s" repeatCount="indefinite"></animate><animate attributeName="y" values="10;6;10" dur="3.6s" repeatCount="indefinite"></animate></text>
    </svg>
  </sc-if>
  <sc-if value="{{isWork}}" hint-placeholder-val="{{ true }}">
    <svg role="img" aria-label="Working" width="{{size}}" height="{{size}}" viewBox="0 0 40 40">
      <ellipse cx="20" cy="35.5" rx="9" ry="1.6" fill="#000000" opacity="0.35"><animate attributeName="rx" values="9;7;9" dur="0.7s" repeatCount="indefinite"></animate></ellipse>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -2.2;0 0" keyTimes="0;0.45;1" dur="0.7s" repeatCount="indefinite" calcMode="spline" keySplines="0.3 0 0.4 1;0.6 0 0.7 1"></animateTransform>
        <rect x="7" y="10" width="26" height="23" rx="11.5" fill="#ECEAE5"></rect>
        <ellipse cx="16" cy="20.5" rx="2" ry="2.8" fill="#1C1C1E"><animate attributeName="ry" values="2.8;2.8;0.3;2.8" keyTimes="0;0.92;0.96;1" dur="3.4s" repeatCount="indefinite"></animate></ellipse>
        <ellipse cx="24" cy="20.5" rx="2" ry="2.8" fill="#1C1C1E"><animate attributeName="ry" values="2.8;2.8;0.3;2.8" keyTimes="0;0.92;0.96;1" dur="3.4s" repeatCount="indefinite"></animate></ellipse>
      </g>
      <circle cx="14" cy="4.5" r="1.5" fill="#A1A1A6"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.2s" repeatCount="indefinite"></animate></circle>
      <circle cx="20" cy="4.5" r="1.5" fill="#A1A1A6"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.2s" begin="0.2s" repeatCount="indefinite"></animate></circle>
      <circle cx="26" cy="4.5" r="1.5" fill="#A1A1A6"><animate attributeName="opacity" values="0.25;1;0.25" dur="1.2s" begin="0.4s" repeatCount="indefinite"></animate></circle>
    </svg>
  </sc-if>
  <sc-if value="{{isWait}}" hint-placeholder-val="{{ false }}">
    <svg role="img" aria-label="Waiting for you" width="{{size}}" height="{{size}}" viewBox="0 0 40 40">
      <ellipse cx="20" cy="35.5" rx="9" ry="1.6" fill="#000000" opacity="0.35"></ellipse>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 20 34;-7 20 34;0 20 34;7 20 34;0 20 34" dur="1.4s" repeatCount="indefinite"></animateTransform>
        <rect x="7" y="11" width="26" height="23" rx="11.5" fill="#ECEAE5"></rect>
        <ellipse cx="16" cy="20.5" rx="2.2" ry="3" fill="#1C1C1E"></ellipse>
        <ellipse cx="24" cy="20.5" rx="2.2" ry="3" fill="#1C1C1E"></ellipse>
        <ellipse cx="20" cy="27" rx="1.6" ry="1.2" fill="#1C1C1E"></ellipse>
      </g>
      <circle cx="33" cy="8" r="4.2" fill="#FF9F0A"><animate attributeName="r" values="4.2;5;4.2" dur="1s" repeatCount="indefinite"></animate></circle>
      <rect x="32.3" y="5.4" width="1.4" height="3.4" rx="0.7" fill="#1C1C1E"></rect>
      <circle cx="33" cy="10.4" r="0.8" fill="#1C1C1E"></circle>
    </svg>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["sleep","work","wait"],"default":"work"},"size":{"editor":"int","min":16,"max":240,"default":96},"$preview":{"width":120,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state ?? 'work';
    const size = Number(this.props.size ?? 96);
    return { isSleep: state === 'sleep', isWork: state === 'work', isWait: state === 'wait', size: size, px: size + 'px' };
  }
}
</script>
</body>
</html>
