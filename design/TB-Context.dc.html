<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Touch Bar context threshold</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
@keyframes fillIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.55}}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="width: 2170px; height: 60px; box-sizing: border-box; background: #000000; display: flex; align-items: center; gap: 12px; padding: 0 8px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #F5F5F7">
  <div aria-hidden="true" style="width: 40px; height: 40px; border-radius: 20px; background: #1C1C1E; color: #8E8E93; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></div>
  <button style="width: 120px; height: 60px; border-radius: 12px; border: none; background: #2C2C2E; color: #F5F5F7; font-family: inherit; font-size: 26px">esc</button>
  <dc-import name="Mascot" state="sleep" size="56" hint-size="56px,56px"></dc-import>
  <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 0 16px">
    <div style="display: flex; justify-content: space-between; font-size: 22px; line-height: 1"><span style="color: #A1A1A6">Session</span><span style="font-variant-numeric: tabular-nums">74% <span style="color: #A1A1A6">· 0:41</span></span></div>
    <div style="height: 8px; border-radius: 4px; background: #2C2C2E; overflow: hidden"><div style="width: 74%; height: 8px; border-radius: 4px; background: #FF9F0A; transform-origin: left; animation: fillIn 900ms cubic-bezier(.2,.8,.2,1) both"></div></div>
  </div>
  <div style="width: 420px; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 0 16px">
    <div style="display: flex; justify-content: space-between; font-size: 22px; line-height: 1"><span style="color: #FF6961; font-weight: 600">Context</span><span style="font-variant-numeric: tabular-nums; color: #FF6961; font-weight: 600">91%</span></div>
    <div style="height: 8px; border-radius: 4px; background: #2C2C2E; overflow: hidden"><div style="width: 91%; height: 8px; border-radius: 4px; background: #FF453A; transform-origin: left; animation: fillIn 900ms 120ms cubic-bezier(.2,.8,.2,1) both, breathe 2s 1s ease-in-out infinite"></div></div>
  </div>
  <div style="display: flex; gap: 12px; animation: slideIn 260ms cubic-bezier(.2,.8,.2,1) both">
    <button style="width: 220px; height: 60px; border-radius: 12px; border: none; background: #0071E3; color: #FFFFFF; font-family: inherit; font-size: 26px; font-weight: 600">Compact</button>
    <button style="width: 150px; height: 60px; border-radius: 12px; border: none; background: #2C2C2E; color: #F5F5F7; font-family: inherit; font-size: 26px">Later</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2170,"height":60}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
