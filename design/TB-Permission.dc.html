<html lang="en">
<head>

<title>Touch Bar permission</title>

<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

</style>
</helmet>
<div style="width: 2170px; height: 60px; box-sizing: border-box; background: #000000; display: flex; align-items: center; gap: 12px; padding: 0 8px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #F5F5F7">

  <button aria-label="Open Clouding Bar" style="width: 120px; height: 60px; flex-shrink: 0; border-radius: 12px; border: none; background: #2C2C2E; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer"><dc-import name="Mascot" state="wait" size="56" hint-size="56px,56px"></dc-import></button>
  <div style="flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 14px; padding: 0 16px; font-size: 26px; white-space: nowrap; overflow: hidden; animation: slideIn 260ms cubic-bezier(.2,.8,.2,1) both">
    <span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 6px; background: #FF9F0A; flex-shrink: 0; animation: pulse 1.4s ease-in-out infinite"></span>
    <span style="color: #A1A1A6">Run</span>
    <span style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; overflow: hidden; text-overflow: ellipsis">npm run build &amp;&amp; npm test</span>
  </div>
  <div style="display: flex; gap: 12px; animation: slideIn 260ms 60ms cubic-bezier(.2,.8,.2,1) both">
    <button style="width: 200px; height: 60px; border-radius: 12px; border: none; background: #0071E3; color: #FFFFFF; font-family: inherit; font-size: 26px; font-weight: 600">Allow</button>
    <button style="width: 200px; height: 60px; border-radius: 12px; border: none; background: #2C2C2E; color: #F5F5F7; font-family: inherit; font-size: 26px">Always</button>
    <button style="width: 150px; height: 60px; border-radius: 12px; border: none; background: #2C2C2E; color: #FF6961; font-family: inherit; font-size: 26px">Deny</button>
  </div>
</div>
