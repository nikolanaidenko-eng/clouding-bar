<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget permission</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#1B1B1D}
@keyframes sheetIn{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</helmet>
<div style="width: 480px; height: 200px; box-sizing: border-box; background: #1B1B1D; padding: 20px 30px; display: flex; flex-direction: column; align-items: center; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #F5F5F7">
  <section aria-label="Permission request" style="width: 420px; box-sizing: border-box; border-radius: 18px; border: 0.5px solid rgba(255,255,255,0.14); background: rgba(40,40,42,0.78); backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%); box-shadow: 0 16px 40px rgba(0,0,0,0.4); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 10px; transform-origin: top center; animation: sheetIn 280ms cubic-bezier(.2,.8,.2,1) both">
    <div style="display: flex; align-items: center; gap: 8px">
      <dc-import name="Mascot" state="wait" size="24" hint-size="24px,24px"></dc-import>
      <span style="font-size: 13px; font-weight: 600">Needs your OK</span>
      <span style="font-size: 12px; color: #A1A1A6; flex-grow: 1">DiaRoute · run in terminal</span>
      <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #FF9F0A; animation: pulse 1.4s ease-in-out infinite"></span>
    </div>
    <div style="font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; line-height: 1.4; background: rgba(0,0,0,0.3); border-radius: 9px; padding: 8px 10px">npm run build &amp;&amp; npm test</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <button title="Return" style="height: 32px; border-radius: 9px; border: none; background: #0071E3; color: #FFFFFF; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Allow</button>
      <button style="height: 32px; border-radius: 9px; border: none; background: rgba(255,255,255,0.08); color: #F5F5F7; font-family: inherit; font-size: 13px; cursor: pointer">Always allow</button>
      <button title="Esc" style="height: 32px; border-radius: 9px; border: none; background: rgba(255,255,255,0.08); color: #FF6961; font-family: inherit; font-size: 13px; cursor: pointer">Deny</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":200}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
