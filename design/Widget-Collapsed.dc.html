<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Widget pill</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#1B1B1D}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</helmet>
<div style="width: 440px; height: 300px; box-sizing: border-box; background: #1B1B1D; padding: 16px 20px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #F5F5F7">
  <button aria-label="Show Clouding Bar" style="height: 44px; box-sizing: border-box; border-radius: 22px; border: 0.5px solid rgba(255,255,255,0.14); background: rgba(40,40,42,0.78); backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%); box-shadow: 0 8px 24px rgba(0,0,0,0.35); display: flex; align-items: center; gap: 16px; padding: 0 20px 0 10px; color: #F5F5F7; font-family: inherit; font-size: 13px; font-variant-numeric: tabular-nums; animation: popIn 220ms cubic-bezier(.2,.8,.2,1) both">
    <dc-import name="Mascot" state="work" size="30" hint-size="30px,30px"></dc-import>
    <span style="display: flex; align-items: center; gap: 8px"><span style="width: 44px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.14); overflow: hidden; display: block"><span style="width: 42%; height: 3px; background: #E5E5EA; display: block"></span></span>42%</span>
    <sc-if value="{{showContext}}" hint-placeholder-val="{{ true }}">
      <span style="display: flex; align-items: center; gap: 4px"><span style="color: #A1A1A6; font-size: 11px">ctx</span>31%</span>
    </sc-if>
    <sc-if value="{{showReset}}" hint-placeholder-val="{{ true }}">
      <span style="display: flex; align-items: center; gap: 4px"><svg aria-label="resets in" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#A1A1A6" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>1:23</span>
    </sc-if>
    <sc-if value="{{showCost}}" hint-placeholder-val="{{ false }}">
      <span style="color: #E5E5EA">$0.84</span>
    </sc-if>
  </button>
  <span style="font-size: 11px; color: #A1A1A6">Always visible, top center · hover 3 s or click to open · drag to move</span>

  <button aria-label="Show Clouding Bar" style="height: 44px; box-sizing: border-box; border-radius: 22px; border: 0.5px solid rgba(255,255,255,0.14); background: rgba(40,40,42,0.78); backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%); box-shadow: 0 8px 24px rgba(0,0,0,0.35); display: flex; align-items: center; gap: 10px; padding: 0 20px 0 10px; color: #A1A1A6; font-family: inherit; font-size: 13px; font-variant-numeric: tabular-nums; animation: popIn 220ms 60ms cubic-bezier(.2,.8,.2,1) both">
    <dc-import name="Mascot" state="sleep" size="30" hint-size="30px,30px"></dc-import>
    <span>42%</span>
  </button>
  <span style="font-size: 11px; color: #A1A1A6">No session · last known limit</span>

  <button aria-label="Claude needs your OK" style="height: 44px; box-sizing: border-box; border-radius: 22px; border: 0.5px solid rgba(255,159,10,0.5); background: rgba(40,40,42,0.78); backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%); box-shadow: 0 8px 24px rgba(0,0,0,0.35); display: flex; align-items: center; gap: 10px; padding: 0 20px 0 10px; color: #F5F5F7; font-family: inherit; font-size: 13px; animation: popIn 220ms 120ms cubic-bezier(.2,.8,.2,1) both">
    <dc-import name="Mascot" state="wait" size="30" hint-size="30px,30px"></dc-import>
    <span>Needs your OK</span>
    <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #FF9F0A; animation: pulse 1.4s ease-in-out infinite"></span>
  </button>

  <button aria-label="Listening" style="height: 44px; box-sizing: border-box; border-radius: 22px; border: 0.5px solid rgba(255,255,255,0.14); background: rgba(40,40,42,0.78); backdrop-filter: blur(28px) saturate(160%); -webkit-backdrop-filter: blur(28px) saturate(160%); box-shadow: 0 8px 24px rgba(0,0,0,0.35); display: flex; align-items: center; gap: 10px; padding: 0 20px 0 10px; color: #F5F5F7; font-family: inherit; font-size: 13px; animation: popIn 220ms 180ms cubic-bezier(.2,.8,.2,1) both">
    <dc-import name="Mascot" state="work" size="30" hint-size="30px,30px"></dc-import>
    <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0071E3" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
    <span style="width: 260px; text-align: left; overflow: hidden; white-space: nowrap; text-overflow: ellipsis">Перескажи последний ответ</span>
  </button>
  <span style="font-size: 11px; color: #A1A1A6">Dictating: the words as they come · tap to stop</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showContext":{"editor":"boolean","default":true},"showReset":{"editor":"boolean","default":true},"showCost":{"editor":"boolean","default":false},"$preview":{"width":440,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      showContext: this.props.showContext ?? true,
      showReset: this.props.showReset ?? true,
      showCost: this.props.showCost ?? false
    };
  }
}
</script>
</body>
</html>
