# Clouding Bar for Windows: tests, then the installer, on a real Windows
# machine. The installer is kept as the run's artifact.
name: Windows

on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      # The app's build wants the hook next to it, so the hook comes first.
      - name: Build the hook
        run: cargo build --release -p cloudingbar-hook

      - name: Put the hook where the installer takes it from
        shell: pwsh
        run: |
          $triple = ((rustc -vV | Select-String "host:").ToString() -split " ")[1]
          Copy-Item target/release/cloudingbar-hook.exe "app/src-tauri/binaries/cloudingbar-hook-$triple.exe"

      - name: Test
        run: cargo test --workspace

      - name: Build the app and its installer
        working-directory: windows/app
        run: |
          npm ci
          npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: Clouding-Bar-Windows
          path: windows/target/release/bundle/nsis/*.exe
          if-no-files-found: error
